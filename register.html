<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – AgriSurvey</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🌾</span>
        <span>AgriSurvey</span>
        <span class="brand-badge">Public Portal</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#about" class="nav-link">About Survey</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-sm btn-secondary">Back to Login</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <div class="logo-badge">🌱</div>
        <h2>New Farmer Registration</h2>
        <p>Create a verified respondent profile for the public survey</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Ramesh Patel">
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
            <input type="email" id="reg-email" class="form-control" placeholder="farmer@example.com">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-mobile">Mobile Number <span class="required">*</span></label>
            <input type="tel" id="reg-mobile" class="form-control" placeholder="10-digit mobile number">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 4 characters">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Repeat password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Complete Registration
        </button>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.92rem; color: var(--text-muted);">
          Already have an account?
          <a href="login.html" style="font-weight: 700; color: var(--primary-700);">Sign In Here</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
