<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – AgriSurvey</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">🌾</span>
        <span>AgriSurvey</span>
        <span class="brand-badge">Public Portal</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="index.html#about" class="nav-link">About Survey</a></li>
        <li><a href="survey.html" class="nav-link">Survey</a></li>
      </ul>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-sm btn-primary">Create Account</a>
      </div>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge">🚜</div>
        <h2>Farmer Login</h2>
        <p>Sign in to access your agricultural survey dashboard</p>
      </div>

      <!-- Quick Demo Credentials Box -->
      <div class="demo-credentials-box">
        <strong>⚡ College / Viva Demo Helper:</strong>
        <div class="demo-credentials-row">
          <span>Email: <code>farmer@agrisurvey.org</code> | Pass: <code>demo</code></span>
          <button type="button" id="btn-fill-demo" class="btn btn-sm btn-gold" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;">
            Auto-Fill
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="farmer@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password <span class="required">*</span></label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary-700);" onclick="event.preventDefault(); showToast('Demo hint: Use password \'demo\' or your registered password.', 'info');">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          Sign In to Survey
        </button>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.92rem; color: var(--text-muted);">
          Don't have an account yet?
          <a href="register.html" style="font-weight: 700; color: var(--primary-700);">Register Now</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
